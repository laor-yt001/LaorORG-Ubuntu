name: LaorORG - Ubuntu Remote Desktop

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-LaorORG:

    runs-on: ubuntu-24.04

    timeout-minutes: 5259600

    env:
      RDP_USER: runneradmin

    steps:

      # ============================================================
      # 1. SYSTEM INFORMATION
      # ============================================================
      - name: System Information
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "LAORORG UBUNTU REMOTE DESKTOP"
          echo "============================================================"

          echo "OS:"
          cat /etc/os-release

          echo
          echo "Kernel:"
          uname -a

          echo
          echo "CPU:"
          nproc

          echo
          echo "Memory:"
          free -h

          echo
          echo "Disk:"
          df -h /

          echo "============================================================"


      # ============================================================
      # 2. UPDATE
      # ============================================================
      - name: Update Ubuntu
        shell: bash
        run: |
          set -e

          sudo apt-get update


      # ============================================================
      # 3. INSTALL XFCE + XRDP
      # ============================================================
      - name: Install Desktop Environment
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "INSTALL XFCE / XRDP"
          echo "============================================================"

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-session \
            xfconf \
            xfdesktop4 \
            xfce4-panel \
            xfwm4 \
            xfce4-terminal \
            thunar \
            dbus \
            dbus-x11 \
            xrdp \
            xorgxrdp \
            xserver-xorg-core \
            policykit-1 \
            policykit-1-gnome \
            sudo \
            curl \
            wget \
            unzip \
            git \
            net-tools \
            ufw

          echo
          echo "XFCE:"
          command -v xfce4-session || true
          command -v startxfce4 || true
          command -v xfconf-query || true

          echo
          echo "XRDP:"
          command -v xrdp || true

          echo
          echo "DBUS:"
          command -v dbus-run-session || true

          echo
          echo "============================================================"
          echo "INSTALL COMPLETE"
          echo "============================================================"


      # ============================================================
      # 4. CREATE runneradmin
      # ============================================================
      - name: Create runneradmin
        shell: bash
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          set -e

          echo "============================================================"
          echo "CREATE RDP USER"
          echo "============================================================"

          if [ -z "$RDP_PASSWORD" ]; then
            echo "ERROR:"
            echo "GitHub Secret RDP_PASSWORD is missing."
            exit 1
          fi

          if id "$RDP_USER" >/dev/null 2>&1; then
            echo "User already exists."
          else
            sudo useradd \
              --create-home \
              --shell /bin/bash \
              "$RDP_USER"
          fi

          echo "$RDP_USER:$RDP_PASSWORD" | sudo chpasswd

          sudo usermod -aG sudo "$RDP_USER"

          echo "$RDP_USER ALL=(ALL) NOPASSWD:ALL" \
            | sudo tee "/etc/sudoers.d/$RDP_USER" >/dev/null

          sudo chmod 440 "/etc/sudoers.d/$RDP_USER"

          echo
          id "$RDP_USER"

          echo "============================================================"


      # ============================================================
      # 5. RESET XFCE USER CONFIGURATION
      # ============================================================
      - name: Reset XFCE User Configuration
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "RESET XFCE USER CONFIGURATION"
          echo "============================================================"

          HOME_DIR="/home/$RDP_USER"

          sudo rm -rf \
            "$HOME_DIR/.config/xfce4" \
            "$HOME_DIR/.cache/sessions" \
            "$HOME_DIR/.cache/xfce4"

          sudo mkdir -p \
            "$HOME_DIR/.config/xfce4" \
            "$HOME_DIR/.cache/sessions"

          sudo chown -R \
            "$RDP_USER:$RDP_USER" \
            "$HOME_DIR/.config" \
            "$HOME_DIR/.cache"

          echo "Old XFCE configuration removed."

          echo "============================================================"


      # ============================================================
      # 6. CREATE SYSTEM XFCE CONFIG
      # ============================================================
      - name: Create XFCE Session Configuration
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "CREATE XFCE SESSION CONFIG"
          echo "============================================================"

          SYSTEM_DIR="/etc/xdg/xfce4/xfconf/xfce-perchannel-xml"

          sudo mkdir -p "$SYSTEM_DIR"

          sudo tee \
            "$SYSTEM_DIR/xfce4-session.xml" >/dev/null <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>

          <channel name="xfce4-session" version="1.0">

            <property name="general" type="empty">

              <property
                name="FailsafeSessionName"
                type="string"
                value="Failsafe"/>

              <property
                name="SessionName"
                type="string"
                value="Default"/>

              <property
                name="SaveOnExit"
                type="bool"
                value="false"/>

              <property
                name="PromptOnLogout"
                type="bool"
                value="false"/>

            </property>

            <property name="sessions" type="empty">

              <property name="Failsafe" type="empty">

                <property
                  name="IsFailsafe"
                  type="bool"
                  value="true"/>

                <property
                  name="Count"
                  type="int"
                  value="5"/>

                <property
                  name="Client0_Command"
                  type="array">

                  <value
                    type="string"
                    value="xfwm4"/>

                </property>

                <property
                  name="Client1_Command"
                  type="array">

                  <value
                    type="string"
                    value="xfsettingsd"/>

                </property>

                <property
                  name="Client2_Command"
                  type="array">

                  <value
                    type="string"
                    value="xfce4-panel"/>

                </property>

                <property
                  name="Client3_Command"
                  type="array">

                  <value
                    type="string"
                    value="Thunar"/>

                  <value
                    type="string"
                    value="--daemon"/>

                </property>

                <property
                  name="Client4_Command"
                  type="array">

                  <value
                    type="string"
                    value="xfdesktop"/>

                </property>

              </property>

            </property>

            <property name="shutdown" type="empty">

              <property
                name="LockScreen"
                type="bool"
                value="false"/>

            </property>

          </channel>
          EOF

          echo
          echo "Configuration created:"
          sudo ls -l "$SYSTEM_DIR/xfce4-session.xml"

          echo "============================================================"


      # ============================================================
      # 7. CREATE USER XFCE CONFIG
      # ============================================================
      - name: Create User XFCE Configuration
        shell: bash
        run: |
          set -e

          HOME_DIR="/home/$RDP_USER"

          USER_DIR="$HOME_DIR/.config/xfce4/xfconf/xfce-perchannel-xml"

          sudo mkdir -p "$USER_DIR"

          sudo cp \
            /etc/xdg/xfce4/xfconf/xfce-perchannel-xml/xfce4-session.xml \
            "$USER_DIR/xfce4-session.xml"

          sudo chown -R \
            "$RDP_USER:$RDP_USER" \
            "$HOME_DIR/.config"

          echo "User XFCE configuration:"
          sudo cat "$USER_DIR/xfce4-session.xml"


      # ============================================================
      # 8. IMPORTANT: DO NOT FORCE XDG_CONFIG_DIRS
      # ============================================================
      - name: Configure XSession
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "CONFIGURE XRDP XSESSION"
          echo "============================================================"

          HOME_DIR="/home/$RDP_USER"

          sudo tee "$HOME_DIR/.xsession" >/dev/null <<'EOF'
          #!/bin/sh

          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR
          unset XDG_CONFIG_DIRS

          export LANG=C.UTF-8
          export LANGUAGE=C.UTF-8
          export LC_ALL=C.UTF-8

          export XDG_SESSION_TYPE=x11
          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_SESSION_DESKTOP=xfce

          exec dbus-run-session -- startxfce4
          EOF

          sudo chmod +x "$HOME_DIR/.xsession"

          sudo chown \
            "$RDP_USER:$RDP_USER" \
            "$HOME_DIR/.xsession"

          echo
          sudo cat "$HOME_DIR/.xsession"

          echo "============================================================"


      # ============================================================
      # 9. CONFIGURE XRDP STARTWM
      # ============================================================
      - name: Configure XRDP
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "CONFIGURE XRDP"
          echo "============================================================"

          sudo cp \
            /etc/xrdp/startwm.sh \
            /etc/xrdp/startwm.sh.original

          sudo tee /etc/xrdp/startwm.sh >/dev/null <<'EOF'
          #!/bin/sh

          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR
          unset XDG_CONFIG_DIRS

          export LANG=C.UTF-8
          export LANGUAGE=C.UTF-8
          export LC_ALL=C.UTF-8

          export XDG_SESSION_TYPE=x11
          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_SESSION_DESKTOP=xfce

          exec dbus-run-session -- startxfce4
          EOF

          sudo chmod +x /etc/xrdp/startwm.sh

          sudo adduser xrdp ssl-cert || true

          echo
          echo "XRDP startwm:"
          sudo cat /etc/xrdp/startwm.sh

          echo "============================================================"


      # ============================================================
      # 10. FORCE XFCONF INITIALIZATION
      # ============================================================
      - name: Initialize XFCONF
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "INITIALIZE XFCONF"
          echo "============================================================"

          sudo -u "$RDP_USER" \
            env \
              HOME="/home/$RDP_USER" \
              USER="$RDP_USER" \
              LOGNAME="$RDP_USER" \
              dbus-run-session -- bash -c '

                echo "DBUS:"
                echo "$DBUS_SESSION_BUS_ADDRESS"

                echo
                echo "XDG_CONFIG_DIRS:"
                echo "${XDG_CONFIG_DIRS:-<not set>}"

                echo
                echo "Starting xfconf query..."

                xfconf-query \
                  -c xfce4-session \
                  -p /general/FailsafeSessionName \
                  -n \
                  -t string \
                  -s Failsafe \
                  2>/dev/null || true

                xfconf-query \
                  -c xfce4-session \
                  -p /general/SessionName \
                  -n \
                  -t string \
                  -s Default \
                  2>/dev/null || true

                echo
                echo "Failsafe name:"

                xfconf-query \
                  -c xfce4-session \
                  -p /general/FailsafeSessionName \
                  2>/dev/null || true

                echo
                echo "Session name:"

                xfconf-query \
                  -c xfce4-session \
                  -p /general/SessionName \
                  2>/dev/null || true

              '

          echo "============================================================"


      # ============================================================
      # 11. VERIFY XFCONF
      # ============================================================
      - name: Verify XFCONF
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "VERIFY XFCONF"
          echo "============================================================"

          sudo -u "$RDP_USER" \
            env \
              HOME="/home/$RDP_USER" \
              USER="$RDP_USER" \
              LOGNAME="$RDP_USER" \
              dbus-run-session -- bash -c '

                echo "---- FailsafeSessionName ----"

                xfconf-query \
                  -c xfce4-session \
                  -p /general/FailsafeSessionName

                echo
                echo "---- SessionName ----"

                xfconf-query \
                  -c xfce4-session \
                  -p /general/SessionName

                echo
                echo "---- Failsafe WM ----"

                xfconf-query \
                  -c xfce4-session \
                  -p /sessions/Failsafe/Client0_Command \
                  -v \
                  || true

                echo
                echo "---- All XFCE session values ----"

                xfconf-query \
                  -c xfce4-session \
                  -lv \
                  || true

              '

          echo
          echo "XFCONF OK."

          echo "============================================================"


      # ============================================================
      # 12. TEST XFCE DIRECTLY
      # ============================================================
      - name: Test XFCE Desktop
        shell: bash
        run: |
          set +e

          echo "============================================================"
          echo "TEST XFCE DESKTOP"
          echo "============================================================"

          sudo -u "$RDP_USER" \
            env \
              HOME="/home/$RDP_USER" \
              USER="$RDP_USER" \
              LOGNAME="$RDP_USER" \
              dbus-run-session -- \
              timeout 20 \
              startxfce4 \
              > /tmp/xfce-test.log 2>&1

          CODE=$?

          echo
          echo "XFCE exit code: $CODE"

          echo
          echo "============================================================"
          echo "XFCE TEST LOG"
          echo "============================================================"

          cat /tmp/xfce-test.log || true

          echo
          echo "============================================================"

          if [ "$CODE" = "124" ]; then
            echo "XFCE stayed running for 20 seconds."
            echo "Desktop startup is working."
          else
            echo "XFCE returned code $CODE."
            echo "Continuing to XRDP."
          fi

          set -e


      # ============================================================
      # 13. ENABLE XRDP
      # ============================================================
      - name: Enable XRDP
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "START XRDP"
          echo "============================================================"

          sudo systemctl daemon-reload

          sudo systemctl enable xrdp

          sudo systemctl restart xrdp

          sleep 5

          echo
          echo "XRDP service:"
          sudo systemctl is-active xrdp

          echo
          echo "XRDP port:"
          sudo ss -lntp | grep ':3389' || true

          echo
          echo "XRDP status:"
          sudo systemctl status xrdp \
            --no-pager \
            || true

          echo "============================================================"


      # ============================================================
      # 14. INSTALL TAILSCALE
      # ============================================================
      - name: Install Tailscale
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "INSTALL TAILSCALE"
          echo "============================================================"

          curl -fsSL https://tailscale.com/install.sh | sh

          sudo systemctl enable --now tailscaled

          sleep 3

          tailscale version

          echo "============================================================"


      # ============================================================
      # 15. CONNECT TAILSCALE
      # ============================================================
      - name: Connect Tailscale
        shell: bash
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          set -e

          echo "============================================================"
          echo "CONNECT TAILSCALE"
          echo "============================================================"

          if [ -z "$TAILSCALE_AUTH_KEY" ]; then
            echo "ERROR: TAILSCALE_AUTH_KEY is missing."
            exit 1
          fi

          sudo tailscale up \
            --authkey="$TAILSCALE_AUTH_KEY" \
            --hostname="laororg-github-runner"

          sleep 5

          TAILSCALE_IP="$(tailscale ip -4)"

          echo "TAILSCALE_IP=$TAILSCALE_IP" >> "$GITHUB_ENV"

          echo
          echo "Tailscale IP:"
          echo "$TAILSCALE_IP"

          echo
          echo "Tailscale status:"
          sudo tailscale status

          echo "============================================================"


      # ============================================================
      # 16. FIREWALL
      # ============================================================
      - name: Configure Firewall
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "CONFIGURE FIREWALL"
          echo "============================================================"

          sudo ufw allow in on tailscale0

          sudo ufw allow \
            from 100.64.0.0/10 \
            to any \
            port 3389 \
            proto tcp

          sudo ufw --force enable

          echo
          sudo ufw status verbose

          echo "============================================================"


      # ============================================================
      # 17. DISABLE NORMAL REBOOT / SHUTDOWN
      # ============================================================
      - name: Block Normal Shutdown Reboot
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "BLOCK NORMAL SHUTDOWN / REBOOT"
          echo "============================================================"

          sudo systemctl mask \
            shutdown.target \
            reboot.target \
            halt.target \
            poweroff.target \
            kexec.target \
            sleep.target \
            suspend.target \
            hibernate.target \
            hybrid-sleep.target \
            || true

          echo "Normal shutdown/reboot targets masked."

          echo "============================================================"


      # ============================================================
      # 18. FINAL XRDP CHECK
      # ============================================================
      - name: Final XRDP Check
        shell: bash
        run: |
          set +e

          echo "============================================================"
          echo "FINAL XRDP CHECK"
          echo "============================================================"

          echo
          echo "XRDP:"
          sudo systemctl is-active xrdp

          echo
          echo "Listening:"
          sudo ss -lntp | grep ':3389' || true

          echo
          echo "Processes:"
          ps aux | grep -E 'xrdp|sesman' | grep -v grep || true

          echo
          echo "Tailscale:"
          tailscale ip -4

          echo
          echo "Firewall:"
          sudo ufw status verbose

          echo
          echo "============================================================"

          set -e


      # ============================================================
      # 19. SHOW CONNECTION INFORMATION
      # ============================================================
      - name: Remote Desktop Information
        shell: bash
        run: |
          echo
          echo "################################################################"
          echo "#                                                              #"
          echo "#             LAORORG UBUNTU REMOTE DESKTOP                   #"
          echo "#                                                              #"
          echo "################################################################"
          echo
          echo "RDP HOST:"
          echo "$TAILSCALE_IP"
          echo
          echo "RDP PORT:"
          echo "3389"
          echo
          echo "RDP ADDRESS:"
          echo "$TAILSCALE_IP:3389"
          echo
          echo "USERNAME:"
          echo "$RDP_USER"
          echo
          echo "PASSWORD:"
          echo "Use GitHub Secret RDP_PASSWORD"
          echo
          echo "DESKTOP:"
          echo "XFCE"
          echo
          echo "################################################################"
          echo
          echo "IMPORTANT:"
          echo "Do not close this GitHub Actions workflow."
          echo "The RDP machine exists only while this job is running."
          echo
          echo "################################################################"


      # ============================================================
      # 20. SHOW LOGS
      # ============================================================
      - name: Show XRDP XFCE Logs
        shell: bash
        run: |
          set +e

          echo
          echo "============================================================"
          echo "XRDP LOG"
          echo "============================================================"

          sudo tail -n 100 \
            /var/log/xrdp.log \
            2>/dev/null || true

          echo
          echo "============================================================"
          echo "XRDP SESMAN LOG"
          echo "============================================================"

          sudo tail -n 150 \
            /var/log/xrdp-sesman.log \
            2>/dev/null || true

          echo
          echo "============================================================"
          echo "XSESSION LOG"
          echo "============================================================"

          sudo tail -n 150 \
            "/home/$RDP_USER/.xsession-errors" \
            2>/dev/null || true

          echo
          echo "============================================================"
          echo "SYSTEMD XRDP"
          echo "============================================================"

          sudo journalctl \
            -u xrdp \
            -n 100 \
            --no-pager \
            2>/dev/null || true

          echo
          echo "============================================================"

          set -e


      # ============================================================
      # 21. KEEP RUNNER ALIVE
      # ============================================================
      - name: Keep Remote Desktop Alive
        shell: bash
        run: |
          set -e

          echo
          echo "################################################################"
          echo "#                                                              #"
          echo "#              UBUNTU GUI IS READY                            #"
          echo "#                                                              #"
          echo "################################################################"
          echo
          echo "RDP:"
          echo "$TAILSCALE_IP:3389"
          echo
          echo "USER:"
          echo "$RDP_USER"
          echo
          echo "DESKTOP:"
          echo "XFCE"
          echo
          echo "################################################################"

          while true
          do

            echo
            echo "============================================================"
            echo "LaorORG Remote Desktop"
            echo "============================================================"

            echo
            echo "Time:"
            date

            echo
            echo "Tailscale IP:"
            tailscale ip -4 || true

            echo
            echo "XRDP:"
            if sudo systemctl is-active --quiet xrdp; then
              echo "RUNNING"
            else
              echo "STOPPED"
            fi

            echo
            echo "3389:"
            if sudo ss -lntp | grep -q ':3389'; then
              echo "LISTENING"
            else
              echo "NOT LISTENING"
            fi

            echo
            echo "CPU:"
            uptime

            echo
            echo "RAM:"
            free -h

            echo
            echo "DISK:"
            df -h /

            echo
            echo "============================================================"

            sleep 60

          done
