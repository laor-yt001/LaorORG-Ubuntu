name: LaorORG - Ubuntu XFCE XRDP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-LaorORG:
    runs-on: ubuntu-24.04

    timeout-minutes: 5259600

    env:
      RDP_USER: runneradmin

    steps:

      # ============================================================
      # 1. SYSTEM INFORMATION
      # ============================================================
      - name: System Information
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "SYSTEM INFORMATION"
          echo "============================================================"

          echo "Hostname:"
          hostname

          echo
          echo "OS:"
          cat /etc/os-release

          echo
          echo "Kernel:"
          uname -a

          echo
          echo "CPU:"
          nproc

          echo
          echo "Memory:"
          free -h

          echo
          echo "Disk:"
          df -h /

          echo
          echo "Runner:"
          whoami

          echo "============================================================"


      # ============================================================
      # 2. UPDATE APT
      # ============================================================
      - name: Update Ubuntu
        shell: bash
        run: |
          set -e

          sudo apt-get update


      # ============================================================
      # 3. INSTALL XFCE + XRDP + DBUS
      # ============================================================
      - name: Install XFCE XRDP DBus
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "INSTALL XFCE / XRDP / DBUS"
          echo "============================================================"

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-session \
            xfconf \
            xfdesktop4 \
            xfce4-panel \
            xfwm4 \
            thunar \
            dbus \
            dbus-x11 \
            xrdp \
            xorgxrdp \
            xserver-xorg-core \
            policykit-1 \
            policykit-1-gnome \
            sudo \
            curl \
            wget \
            unzip \
            git \
            net-tools \
            ufw

          echo
          echo "Packages installed."

          echo
          echo "XFCE binaries:"
          command -v xfce4-session || true
          command -v startxfce4 || true
          command -v xfconf-query || true

          echo
          echo "XRDP:"
          command -v xrdp || true

          echo
          echo "DBUS:"
          command -v dbus-run-session || true

          echo
          echo "============================================================"
          echo "INSTALLATION COMPLETE"
          echo "============================================================"


      # ============================================================
      # 4. DO NOT FAIL BECAUSE xfconfd IS NOT IN PATH
      # ============================================================
      - name: Verify XFCE Installation
        shell: bash
        run: |
          set +e

          echo "============================================================"
          echo "XFCE INSTALLATION CHECK"
          echo "============================================================"

          echo
          echo "---- XFCE binaries ----"

          command -v xfce4-session || true
          command -v startxfce4 || true
          command -v xfconf-query || true

          echo
          echo "---- xfconfd location ----"

          XFCONFD_PATH="$(dpkg -L xfconf 2>/dev/null | grep '/xfconfd$' | head -n 1)"

          if [ -n "$XFCONFD_PATH" ]; then
            echo "xfconfd found:"
            echo "$XFCONFD_PATH"
          else
            echo "xfconfd was not found by dpkg."
          fi

          echo
          echo "---- Installed XFCE packages ----"

          dpkg -s xfconf >/dev/null 2>&1 \
            && echo "xfconf: INSTALLED" \
            || echo "xfconf: NOT INSTALLED"

          dpkg -s xfce4-session >/dev/null 2>&1 \
            && echo "xfce4-session: INSTALLED" \
            || echo "xfce4-session: NOT INSTALLED"

          dpkg -s xfce4 >/dev/null 2>&1 \
            && echo "xfce4: INSTALLED" \
            || echo "xfce4: NOT INSTALLED"

          dpkg -s xrdp >/dev/null 2>&1 \
            && echo "xrdp: INSTALLED" \
            || echo "xrdp: NOT INSTALLED"

          dpkg -s xorgxrdp >/dev/null 2>&1 \
            && echo "xorgxrdp: INSTALLED" \
            || echo "xorgxrdp: NOT INSTALLED"

          dpkg -s dbus-x11 >/dev/null 2>&1 \
            && echo "dbus-x11: INSTALLED" \
            || echo "dbus-x11: NOT INSTALLED"

          echo
          echo "---- Versions ----"

          xfce4-session --version 2>/dev/null || true
          xfconf-query --version 2>/dev/null || true
          xrdp --version 2>/dev/null || true

          echo
          echo "============================================================"
          echo "XFCE CHECK COMPLETE"
          echo "============================================================"

          set -e


      # ============================================================
      # 5. CREATE runneradmin
      # ============================================================
      - name: Create runneradmin
        shell: bash
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          set -e

          echo "============================================================"
          echo "CREATE USER: runneradmin"
          echo "============================================================"

          if [ -z "$RDP_PASSWORD" ]; then
            echo "ERROR: RDP_PASSWORD GitHub Secret is not configured."
            echo
            echo "Create:"
            echo "Repository Settings -> Secrets and variables -> Actions"
            echo
            echo "Secret name:"
            echo "RDP_PASSWORD"
            echo
            echo "Example value:"
            echo "Laor@001"
            exit 1
          fi

          if id "$RDP_USER" >/dev/null 2>&1; then
            echo "User $RDP_USER already exists."
          else
            sudo useradd \
              -m \
              -s /bin/bash \
              "$RDP_USER"

            echo "Created $RDP_USER."
          fi

          echo "$RDP_USER:$RDP_PASSWORD" | sudo chpasswd

          sudo usermod -aG sudo "$RDP_USER"

          echo "$RDP_USER ALL=(ALL) NOPASSWD:ALL" \
            | sudo tee "/etc/sudoers.d/$RDP_USER" >/dev/null

          sudo chmod 440 "/etc/sudoers.d/$RDP_USER"

          echo
          echo "User information:"
          id "$RDP_USER"

          echo
          echo "Home:"
          sudo ls -ld "/home/$RDP_USER"

          echo "============================================================"


      # ============================================================
      # 6. CREATE XFCE FAILSAFE CONFIGURATION
      # ============================================================
      - name: Create XFCE Failsafe Configuration
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "CREATE XFCE FAILSAFE CONFIGURATION"
          echo "============================================================"

          SYSTEM_XFCE_DIR="/etc/xdg/xfce4/xfconf/xfce-perchannel-xml"
          USER_XFCE_DIR="/home/$RDP_USER/.config/xfce4/xfconf/xfce-perchannel-xml"

          sudo mkdir -p "$SYSTEM_XFCE_DIR"
          sudo mkdir -p "$USER_XFCE_DIR"

          echo
          echo "Creating system xfce4-session.xml..."

          sudo tee "$SYSTEM_XFCE_DIR/xfce4-session.xml" >/dev/null <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>

          <channel name="xfce4-session" version="1.0">

            <property name="general" type="empty">

              <property
                name="FailsafeSessionName"
                type="string"
                value="Failsafe"/>

              <property
                name="SessionName"
                type="string"
                value="Default"/>

              <property
                name="SaveOnExit"
                type="bool"
                value="false"/>

              <property
                name="PromptOnLogout"
                type="bool"
                value="false"/>

            </property>

            <property name="sessions" type="empty">

              <property name="Failsafe" type="empty">

                <property
                  name="IsFailsafe"
                  type="bool"
                  value="true"/>

                <property
                  name="Count"
                  type="int"
                  value="5"/>

                <property
                  name="Client0_Command"
                  type="string"
                  value="xfwm4"/>

                <property
                  name="Client1_Command"
                  type="string"
                  value="xfsettingsd"/>

                <property
                  name="Client2_Command"
                  type="string"
                  value="xfce4-panel"/>

                <property
                  name="Client3_Command"
                  type="string"
                  value="Thunar --daemon"/>

                <property
                  name="Client4_Command"
                  type="string"
                  value="xfdesktop"/>

              </property>

            </property>

            <property name="shutdown" type="empty">

              <property
                name="LockScreen"
                type="bool"
                value="false"/>

            </property>

          </channel>
          EOF

          echo
          echo "Copying XFCE session configuration to runneradmin..."

          sudo cp \
            "$SYSTEM_XFCE_DIR/xfce4-session.xml" \
            "$USER_XFCE_DIR/xfce4-session.xml"

          sudo chown -R \
            "$RDP_USER:$RDP_USER" \
            "/home/$RDP_USER/.config"

          echo
          echo "Deleting old XFCE session cache..."

          sudo rm -rf \
            "/home/$RDP_USER/.cache/sessions"

          sudo mkdir -p \
            "/home/$RDP_USER/.cache/sessions"

          sudo chown -R \
            "$RDP_USER:$RDP_USER" \
            "/home/$RDP_USER/.cache"

          echo
          echo "---- SYSTEM CONFIG ----"

          sudo grep -E \
            'FailsafeSessionName|SessionName|IsFailsafe|Count' \
            "$SYSTEM_XFCE_DIR/xfce4-session.xml" \
            || true

          echo
          echo "---- USER CONFIG ----"

          sudo grep -E \
            'FailsafeSessionName|SessionName|IsFailsafe|Count' \
            "$USER_XFCE_DIR/xfce4-session.xml" \
            || true

          echo
          echo "============================================================"
          echo "XFCE FAILSAFE CONFIGURATION CREATED"
          echo "============================================================"


      # ============================================================
      # 7. CREATE .xsession
      # ============================================================
      - name: Configure XFCE XSession
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "CONFIGURE USER XSESSION"
          echo "============================================================"

          sudo tee "/home/$RDP_USER/.xsession" >/dev/null <<'EOF'
          #!/bin/sh

          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR

          export LANG=C.UTF-8
          export LANGUAGE=C.UTF-8
          export LC_ALL=C.UTF-8

          export XDG_SESSION_TYPE=x11
          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_SESSION_DESKTOP=xfce

          export XDG_CONFIG_DIRS="/etc/xdg"

          exec dbus-run-session -- startxfce4
          EOF

          sudo chmod +x "/home/$RDP_USER/.xsession"

          sudo chown \
            "$RDP_USER:$RDP_USER" \
            "/home/$RDP_USER/.xsession"

          echo
          echo "XSession:"
          sudo cat "/home/$RDP_USER/.xsession"

          echo "============================================================"


      # ============================================================
      # 8. CONFIGURE XRDP
      # ============================================================
      - name: Configure XRDP
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "CONFIGURE XRDP"
          echo "============================================================"

          if [ -f /etc/xrdp/startwm.sh ]; then
            sudo cp \
              /etc/xrdp/startwm.sh \
              /etc/xrdp/startwm.sh.backup
          fi

          sudo tee /etc/xrdp/startwm.sh >/dev/null <<'EOF'
          #!/bin/sh

          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR

          export LANG=C.UTF-8
          export LANGUAGE=C.UTF-8
          export LC_ALL=C.UTF-8

          export XDG_SESSION_TYPE=x11
          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_SESSION_DESKTOP=xfce

          export XDG_CONFIG_DIRS="/etc/xdg"

          exec dbus-run-session -- startxfce4
          EOF

          sudo chmod +x /etc/xrdp/startwm.sh

          sudo adduser xrdp ssl-cert || true

          echo
          echo "XRDP start script:"
          sudo cat /etc/xrdp/startwm.sh

          echo
          echo "============================================================"


      # ============================================================
      # 9. TEST XFCONF BEFORE XRDP
      # ============================================================
      - name: Test XFCONF DBus Session
        shell: bash
        run: |
          set +e

          echo "============================================================"
          echo "TEST XFCONF / DBUS"
          echo "============================================================"

          sudo -u "$RDP_USER" \
            env \
              HOME="/home/$RDP_USER" \
              USER="$RDP_USER" \
              LOGNAME="$RDP_USER" \
              XDG_CONFIG_DIRS="/etc/xdg" \
              dbus-run-session -- sh -c '

                echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS"
                echo "XDG_CONFIG_DIRS=$XDG_CONFIG_DIRS"

                echo
                echo "---- FailsafeSessionName ----"

                xfconf-query \
                  -c xfce4-session \
                  -p /general/FailsafeSessionName \
                  || true

                echo
                echo "---- SessionName ----"

                xfconf-query \
                  -c xfce4-session \
                  -p /general/SessionName \
                  || true

                echo
                echo "---- XFCE session properties ----"

                xfconf-query \
                  -c xfce4-session \
                  -lv \
                  || true

              '

          echo
          echo "XFCONF TEST FINISHED"

          set -e


      # ============================================================
      # 10. TEST STARTXFCE4
      # ============================================================
      - name: Test XFCE Session
        shell: bash
        run: |
          set +e

          echo "============================================================"
          echo "TEST XFCE SESSION"
          echo "============================================================"

          sudo -u "$RDP_USER" \
            env \
              HOME="/home/$RDP_USER" \
              USER="$RDP_USER" \
              LOGNAME="$RDP_USER" \
              XDG_CONFIG_DIRS="/etc/xdg" \
              dbus-run-session -- \
              timeout 15 \
              startxfce4 \
              > /tmp/xfce-test.log 2>&1

          XFCE_EXIT=$?

          echo
          echo "XFCE exit code: $XFCE_EXIT"

          echo
          echo "============================================================"
          echo "XFCE TEST LOG"
          echo "============================================================"

          cat /tmp/xfce-test.log || true

          echo
          echo "============================================================"

          # timeout is expected because XFCE is a long-running desktop
          if [ "$XFCE_EXIT" -eq 124 ]; then
            echo "XFCE started successfully and remained running."
          else
            echo "XFCE exited with code $XFCE_EXIT."
            echo "Continuing so XRDP can be tested."
          fi

          set -e


      # ============================================================
      # 11. CONFIGURE XRDP SERVICE
      # ============================================================
      - name: Enable XRDP
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "ENABLE XRDP"
          echo "============================================================"

          sudo systemctl daemon-reload

          sudo systemctl enable xrdp
          sudo systemctl restart xrdp

          sleep 3

          echo
          echo "XRDP status:"
          sudo systemctl status xrdp \
            --no-pager \
            || true

          echo
          echo "Listening ports:"
          sudo ss -lntp | grep ':3389' || true

          echo "============================================================"


      # ============================================================
      # 12. INSTALL TAILSCALE
      # ============================================================
      - name: Install Tailscale
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "INSTALL TAILSCALE"
          echo "============================================================"

          curl -fsSL https://tailscale.com/install.sh | sh

          sudo systemctl enable --now tailscaled

          sleep 2

          tailscale version

          echo "============================================================"


      # ============================================================
      # 13. CONNECT TAILSCALE
      # ============================================================
      - name: Connect Tailscale
        shell: bash
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          set -e

          echo "============================================================"
          echo "CONNECT TAILSCALE"
          echo "============================================================"

          if [ -z "$TAILSCALE_AUTH_KEY" ]; then
            echo "ERROR: TAILSCALE_AUTH_KEY is not configured."
            echo
            echo "Add this GitHub Secret:"
            echo "TAILSCALE_AUTH_KEY"
            exit 1
          fi

          sudo tailscale up \
            --authkey="$TAILSCALE_AUTH_KEY" \
            --hostname="laororg-github-runner"

          sleep 5

          echo
          echo "Tailscale status:"
          sudo tailscale status

          echo
          echo "Tailscale IPv4:"
          TAILSCALE_IP="$(tailscale ip -4)"

          echo "$TAILSCALE_IP"

          echo "TAILSCALE_IP=$TAILSCALE_IP" >> "$GITHUB_ENV"

          echo
          echo "============================================================"


      # ============================================================
      # 14. CONFIGURE FIREWALL
      # ============================================================
      - name: Configure UFW
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "CONFIGURE FIREWALL"
          echo "============================================================"

          # Allow Tailscale itself
          sudo ufw allow in on tailscale0

          # Allow XRDP ONLY from Tailscale network
          sudo ufw allow from 100.64.0.0/10 to any port 3389 proto tcp

          # SSH is not required for XRDP.
          # Do NOT expose 3389 publicly.

          sudo ufw --force enable

          echo
          sudo ufw status verbose

          echo "============================================================"


      # ============================================================
      # 15. BLOCK NORMAL SHUTDOWN / REBOOT TARGETS
      # ============================================================
      - name: Disable Normal Shutdown Reboot
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "DISABLE NORMAL SHUTDOWN / REBOOT"
          echo "============================================================"

          sudo systemctl mask \
            shutdown.target \
            reboot.target \
            halt.target \
            poweroff.target \
            kexec.target \
            sleep.target \
            suspend.target \
            hibernate.target \
            hybrid-sleep.target \
            || true

          echo
          echo "Masked targets:"
          systemctl list-unit-files \
            | grep -E \
              'shutdown.target|reboot.target|poweroff.target|halt.target' \
            || true

          echo "============================================================"


      # ============================================================
      # 16. VERIFY USER
      # ============================================================
      - name: Verify RDP User
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo "VERIFY RDP USER"
          echo "============================================================"

          id "$RDP_USER"

          echo
          echo "Home:"
          ls -la "/home/$RDP_USER"

          echo
          echo "XSession:"
          ls -la "/home/$RDP_USER/.xsession"

          echo
          echo "XFCE configuration:"
          ls -la \
            "/home/$RDP_USER/.config/xfce4/xfconf/xfce-perchannel-xml"

          echo "============================================================"


      # ============================================================
      # 17. VERIFY XRDP
      # ============================================================
      - name: Verify XRDP
        shell: bash
        run: |
          set +e

          echo "============================================================"
          echo "XRDP VERIFICATION"
          echo "============================================================"

          echo
          echo "XRDP service:"
          sudo systemctl is-active xrdp

          echo
          echo "XRDP enabled:"
          sudo systemctl is-enabled xrdp

          echo
          echo "Port 3389:"
          sudo ss -lntp | grep ':3389' || true

          echo
          echo "XRDP processes:"
          ps aux | grep -E 'xrdp|xrdp-sesman' | grep -v grep || true

          echo
          echo "============================================================"

          set -e


      # ============================================================
      # 18. SHOW CONNECTION INFORMATION
      # ============================================================
      - name: Display Remote Connection Information
        shell: bash
        run: |
          set -e

          echo
          echo "################################################################"
          echo "#                                                              #"
          echo "#                 LaorORG REMOTE DESKTOP                      #"
          echo "#                                                              #"
          echo "################################################################"
          echo
          echo "Protocol : RDP"
          echo "Host     : $TAILSCALE_IP"
          echo "Port     : 3389"
          echo "Username : $RDP_USER"
          echo
          echo "RDP address:"
          echo "$TAILSCALE_IP:3389"
          echo
          echo "Use Microsoft Remote Desktop / Remmina."
          echo
          echo "Password:"
          echo "Use the value stored in GitHub Secret RDP_PASSWORD."
          echo
          echo "################################################################"


      # ============================================================
      # 19. SHOW DIAGNOSTIC INFORMATION
      # ============================================================
      - name: Diagnostic Information
        shell: bash
        run: |
          set +e

          echo "============================================================"
          echo "FINAL DIAGNOSTICS"
          echo "============================================================"

          echo
          echo "---- SYSTEM ----"
          hostname
          uname -a

          echo
          echo "---- MEMORY ----"
          free -h

          echo
          echo "---- CPU ----"
          nproc

          echo
          echo "---- DISK ----"
          df -h /

          echo
          echo "---- TAILSCALE ----"
          sudo tailscale status

          echo
          echo "---- TAILSCALE IP ----"
          tailscale ip -4

          echo
          echo "---- XRDP ----"
          sudo systemctl status xrdp \
            --no-pager \
            || true

          echo
          echo "---- PORT 3389 ----"
          sudo ss -lntp | grep ':3389' || true

          echo
          echo "---- UFW ----"
          sudo ufw status verbose

          echo
          echo "---- XFCE CONFIG ----"
          sudo cat \
            /etc/xdg/xfce4/xfconf/xfce-perchannel-xml/xfce4-session.xml \
            || true

          echo
          echo "---- USER XFCE CONFIG ----"
          sudo cat \
            "/home/$RDP_USER/.config/xfce4/xfconf/xfce-perchannel-xml/xfce4-session.xml" \
            || true

          echo
          echo "---- XSESSION ----"
          sudo cat \
            "/home/$RDP_USER/.xsession" \
            || true

          echo
          echo "---- XRDP STARTWM ----"
          sudo cat /etc/xrdp/startwm.sh || true

          echo
          echo "---- XRDP LOG ----"
          sudo tail -n 100 /var/log/xrdp.log 2>/dev/null || true

          echo
          echo "---- XRDP SESMAN LOG ----"
          sudo tail -n 150 /var/log/xrdp-sesman.log 2>/dev/null || true

          echo
          echo "---- USER XSESSION LOG ----"
          sudo tail -n 150 \
            "/home/$RDP_USER/.xsession-errors" \
            2>/dev/null \
            || true

          echo
          echo "---- JOURNAL XRDP ----"
          sudo journalctl \
            -u xrdp \
            -n 100 \
            --no-pager \
            2>/dev/null \
            || true

          echo
          echo "============================================================"

          set -e


      # ============================================================
      # 20. KEEP RUNNER ALIVE
      # ============================================================
      - name: Keep Runner Alive
        shell: bash
        run: |
          set -e

          echo
          echo "################################################################"
          echo "#                                                              #"
          echo "#             LaorORG Ubuntu GUI is running                   #"
          echo "#                                                              #"
          echo "################################################################"
          echo
          echo "RDP:"
          echo "$TAILSCALE_IP:3389"
          echo
          echo "Username:"
          echo "$RDP_USER"
          echo
          echo "XFCE:"
          echo "Enabled"
          echo
          echo "Tailscale:"
          echo "Connected"
          echo
          echo "The GitHub Actions job will remain active."
          echo "GitHub-hosted runners can still be terminated by GitHub."
          echo

          while true
          do
            echo
            echo "============================================================"
            echo "LaorORG Remote Desktop Status"
            echo "Time: $(date)"
            echo "============================================================"

            echo
            echo "Tailscale:"
            tailscale ip -4 || true

            echo
            echo "XRDP:"
            if sudo systemctl is-active --quiet xrdp; then
              echo "RUNNING"
            else
              echo "NOT RUNNING"
            fi

            echo
            echo "Port 3389:"
            if sudo ss -lntp | grep -q ':3389'; then
              echo "LISTENING"
            else
              echo "NOT LISTENING"
            fi

            echo
            echo "CPU:"
            uptime

            echo
            echo "Memory:"
            free -h

            echo
            echo "Disk:"
            df -h /

            sleep 60
          done
