name: LaorORG Ubuntu GUI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu-gui:
    name: LaorORG Ubuntu XFCE RDP
    runs-on: ubuntu-24.04

    timeout-minutes: 350

    env:
      RDP_USER: runneradmin
      RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      HOSTNAME: LaorORG-GitHub-Ubuntu

    steps:

      # ============================================================
      # SYSTEM UPDATE
      # ============================================================
      - name: Update System
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get upgrade -y


      # ============================================================
      # INSTALL XFCE + XRDP
      # ============================================================
      - name: Install XFCE Desktop and XRDP
        shell: bash
        run: |
          set -eux

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-goodies \
            xfce4-session \
            xfce4-panel \
            xfce4-settings \
            xfconf \
            xfdesktop4 \
            xfwm4 \
            xfce4-terminal \
            dbus \
            dbus-x11 \
            dbus-user-session \
            xorg \
            xorgxrdp \
            xrdp \
            xauth \
            policykit-1 \
            policykit-1-gnome \
            curl \
            wget \
            git \
            unzip \
            nano \
            vim \
            htop \
            net-tools \
            iproute2 \
            ca-certificates \
            sudo \
            ufw


      # ============================================================
      # HOSTNAME
      # ============================================================
      - name: Configure Hostname
        shell: bash
        run: |
          set -eux

          sudo hostnamectl set-hostname "$HOSTNAME"

          echo "$HOSTNAME" | sudo tee /etc/hostname

          if ! grep -q "$HOSTNAME" /etc/hosts; then
            echo "127.0.1.1 $HOSTNAME" | \
              sudo tee -a /etc/hosts
          fi

          hostname


      # ============================================================
      # CREATE RDP USER
      # ============================================================
      - name: Configure RDP User
        shell: bash
        run: |
          set -eux

          if [ -z "$RDP_PASSWORD" ]; then
            echo "ERROR:"
            echo "RDP_PASSWORD GitHub Secret is missing."
            exit 1
          fi

          # Create runneradmin if it doesn't exist.
          if id "$RDP_USER" >/dev/null 2>&1; then
            echo "$RDP_USER already exists"
          else
            sudo useradd \
              --create-home \
              --shell /bin/bash \
              "$RDP_USER"
          fi

          # Set password.
          echo "$RDP_USER:$RDP_PASSWORD" | sudo chpasswd

          # Add groups.
          sudo usermod -aG sudo "$RDP_USER"
          sudo usermod -aG ssl-cert "$RDP_USER"

          # Passwordless sudo.
          echo "$RDP_USER ALL=(ALL) NOPASSWD:ALL" | \
            sudo tee "/etc/sudoers.d/$RDP_USER"

          sudo chmod 440 "/etc/sudoers.d/$RDP_USER"

          # Make sure home directory belongs to user.
          sudo chown -R "$RDP_USER:$RDP_USER" \
            "/home/$RDP_USER"

          echo "User configured:"
          id "$RDP_USER"


      # ============================================================
      # XFCE SESSION CONFIGURATION
      # ============================================================
      - name: Configure XFCE Session
        shell: bash
        run: |
          set -eux

          USER_HOME="/home/$RDP_USER"

          # Create XFCE directories.
          sudo -u "$RDP_USER" mkdir -p \
            "$USER_HOME/.config/xfce4"

          sudo -u "$RDP_USER" mkdir -p \
            "$USER_HOME/.cache"

          sudo -u "$RDP_USER" mkdir -p \
            "$USER_HOME/.local/share"

          # --------------------------------------------------------
          # IMPORTANT:
          # .xsession launches XFCE through DBus.
          # --------------------------------------------------------
          sudo tee "$USER_HOME/.xsession" > /dev/null <<'EOF'
          #!/bin/sh

          export LANG=C.UTF-8
          export LANGUAGE=C.UTF-8
          export LC_ALL=C.UTF-8

          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_SESSION_DESKTOP=xfce
          export XDG_CONFIG_DIRS=/etc/xdg/xdg-xfce:/etc/xdg
          export XDG_DATA_DIRS=/usr/share/xfce4:/usr/local/share:/usr/share

          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR

          exec dbus-launch --exit-with-session startxfce4
          EOF

          sudo chmod +x "$USER_HOME/.xsession"

          sudo chown "$RDP_USER:$RDP_USER" \
            "$USER_HOME/.xsession"

          # --------------------------------------------------------
          # XFCE configuration
          # --------------------------------------------------------
          sudo -u "$RDP_USER" mkdir -p \
            "$USER_HOME/.config/xfce4/xfconf/xfce-perchannel-xml"

          # Disable screen blanking for the remote session.
          sudo -u "$RDP_USER" tee \
            "$USER_HOME/.config/xfce4/xfconf/xfce-perchannel-xml/xfce4-power-manager.xml" \
            > /dev/null <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>

          <channel name="xfce4-power-manager" version="1.0">
            <property name="xfce4-power-manager" type="empty">
              <property name="blank-on-ac" type="int" value="0"/>
              <property name="dpms-enabled" type="bool" value="false"/>
              <property name="dpms-on-ac-sleep" type="int" value="0"/>
              <property name="dpms-on-ac-off" type="int" value="0"/>
            </property>
          </channel>
          EOF

          sudo chown -R "$RDP_USER:$RDP_USER" \
            "$USER_HOME/.config"

          echo "XFCE session configured."


      # ============================================================
      # XRDP CONFIGURATION
      # ============================================================
      - name: Configure XRDP
        shell: bash
        run: |
          set -eux

          # Backup configuration.
          sudo cp \
            /etc/xrdp/startwm.sh \
            /etc/xrdp/startwm.sh.backup

          # --------------------------------------------------------
          # Correct XRDP startup script
          # --------------------------------------------------------
          sudo tee /etc/xrdp/startwm.sh > /dev/null <<'EOF'
          #!/bin/sh

          if [ -r /etc/profile ]; then
              . /etc/profile
          fi

          if [ -r "$HOME/.profile" ]; then
              . "$HOME/.profile"
          fi

          export LANG=C.UTF-8
          export LANGUAGE=C.UTF-8
          export LC_ALL=C.UTF-8

          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_SESSION_DESKTOP=xfce
          export XDG_CONFIG_DIRS=/etc/xdg/xdg-xfce:/etc/xdg
          export XDG_DATA_DIRS=/usr/share/xfce4:/usr/local/share:/usr/share

          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR

          # Start XFCE with a DBus session.
          exec dbus-launch --exit-with-session startxfce4
          EOF

          sudo chmod +x /etc/xrdp/startwm.sh

          # XRDP needs certificate access.
          sudo adduser xrdp ssl-cert || true

          # Enable services.
          sudo systemctl enable xrdp
          sudo systemctl enable xrdp-sesman

          # Restart.
          sudo systemctl restart xrdp-sesman
          sudo systemctl restart xrdp

          sleep 3

          echo ""
          echo "XRDP:"
          sudo systemctl --no-pager status xrdp || true

          echo ""
          echo "XRDP-Sesman:"
          sudo systemctl --no-pager status xrdp-sesman || true


      # ============================================================
      # INSTALL TAILSCALE
      # ============================================================
      - name: Install Tailscale
        shell: bash
        run: |
          set -eux

          if [ -z "$TAILSCALE_AUTH_KEY" ]; then
            echo "ERROR:"
            echo "TAILSCALE_AUTH_KEY GitHub Secret is missing."
            exit 1
          fi

          curl -fsSL \
            https://tailscale.com/install.sh | sh

          sudo systemctl enable tailscaled
          sudo systemctl start tailscaled

          sleep 3

          tailscale version


      # ============================================================
      # CONNECT TAILSCALE
      # ============================================================
      - name: Connect Tailscale
        shell: bash
        run: |
          set -eux

          sudo tailscale up \
            --auth-key="$TAILSCALE_AUTH_KEY" \
            --hostname="$HOSTNAME" \
            --accept-dns=true

          sleep 5

          echo ""
          echo "Tailscale status:"
          tailscale status

          echo ""
          echo "Tailscale IPv4:"

          TAILSCALE_IP=$(tailscale ip -4)

          echo "$TAILSCALE_IP"

          echo "TAILSCALE_IP=$TAILSCALE_IP" >> "$GITHUB_ENV"


      # ============================================================
      # FIREWALL
      # ============================================================
      - name: Configure Firewall
        shell: bash
        run: |
          set -eux

          sudo ufw --force reset

          sudo ufw default deny incoming
          sudo ufw default allow outgoing

          # RDP ONLY through Tailscale.
          sudo ufw allow \
            from 100.64.0.0/10 \
            to any port 3389 \
            proto tcp

          # Tailscale interface.
          sudo ufw allow in on tailscale0

          sudo ufw --force enable

          echo ""
          sudo ufw status verbose


      # ============================================================
      # TEST XFCE BEFORE RDP
      # ============================================================
      - name: Verify XFCE Installation
        shell: bash
        run: |
          set -eux

          echo "XFCE binaries:"

          command -v startxfce4
          command -v xfce4-session
          command -v xfconf-query
          command -v dbus-launch

          echo ""
          echo "XFCE version:"
          xfce4-session --version || true

          echo ""
          echo "DBus:"
          dbus-launch --version || true

          echo ""
          echo "Installed XFCE packages:"
          dpkg -l | grep -E \
            'xfce4|xfconf|xfdesktop|xfwm4|dbus-x11|xrdp|xorgxrdp' \
            || true


      # ============================================================
      # TEST XRDP
      # ============================================================
      - name: Verify XRDP
        shell: bash
        run: |
          set -eux

          echo "XRDP service:"
          sudo systemctl is-active xrdp

          echo ""
          echo "XRDP port:"
          sudo ss -lntp | grep ':3389' || true

          echo ""
          echo "XRDP processes:"
          ps aux | grep '[x]rdp' || true


      # ============================================================
      # SHUTDOWN / REBOOT PROTECTION
      # ============================================================
      - name: Disable Shutdown and Reboot Targets
        shell: bash
        run: |
          set -eux

          sudo systemctl mask shutdown.target || true
          sudo systemctl mask reboot.target || true
          sudo systemctl mask halt.target || true
          sudo systemctl mask poweroff.target || true

          echo "Shutdown/reboot targets masked."


      # ============================================================
      # FINAL INFORMATION
      # ============================================================
      - name: Display Remote Desktop Information
        shell: bash
        run: |
          TAILSCALE_IP=$(tailscale ip -4)

          echo ""
          echo "============================================================"
          echo "       LAORORG UBUNTU GUI READY"
          echo "============================================================"
          echo ""
          echo "OS:"
          echo "Ubuntu 24.04"
          echo ""
          echo "Desktop:"
          echo "XFCE"
          echo ""
          echo "Remote Desktop:"
          echo "XRDP"
          echo ""
          echo "Tailscale IP:"
          echo "$TAILSCALE_IP"
          echo ""
          echo "RDP:"
          echo "$TAILSCALE_IP:3389"
          echo ""
          echo "Username:"
          echo "runneradmin"
          echo ""
          echo "Password:"
          echo "RDP_PASSWORD GitHub Secret"
          echo ""
          echo "============================================================"
          echo "CONNECT FROM WINDOWS"
          echo "============================================================"
          echo ""
          echo "mstsc"
          echo ""
          echo "Computer:"
          echo "$TAILSCALE_IP:3389"
          echo ""
          echo "Username:"
          echo "runneradmin"
          echo ""
          echo "============================================================"


      # ============================================================
      # KEEP ALIVE
      # ============================================================
      - name: Keep Ubuntu GUI Alive
        shell: bash
        run: |
          set +e

          echo ""
          echo "============================================================"
          echo " LAORORG UBUNTU GUI ONLINE"
          echo "============================================================"

          while true
          do
            echo ""
            echo "------------------------------------------------------------"
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] RUNNER ALIVE"
            echo "------------------------------------------------------------"

            echo ""
            echo "Hostname:"
            hostname

            echo ""
            echo "Uptime:"
            uptime

            echo ""
            echo "CPU:"
            nproc

            echo ""
            echo "Memory:"
            free -h

            echo ""
            echo "Disk:"
            df -h / | tail -1

            echo ""
            echo "Tailscale IP:"
            tailscale ip -4 2>/dev/null || true

            echo ""
            echo "XRDP:"
            sudo systemctl is-active xrdp 2>/dev/null || true

            echo ""
            echo "XRDP port:"
            sudo ss -lntp 2>/dev/null | grep ':3389' || true

            echo ""
            echo "------------------------------------------------------------"

            sleep 300
          done
