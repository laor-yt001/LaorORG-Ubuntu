name: LaorORG Ubuntu GUI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu-gui:
    name: LaorORG Ubuntu GUI Remote Desktop
    runs-on: ubuntu-24.04

    # GitHub-hosted jobs are temporary.
    # This keeps the workflow alive until it is manually cancelled
    # or GitHub terminates the runner/job.
    timeout-minutes: 350

    env:
      RDP_USER: runneradmin
      RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      HOSTNAME: LaorORG-GitHub-Ubuntu

    steps:

      # ============================================================
      # SYSTEM INFORMATION
      # ============================================================
      - name: System Information
        shell: bash
        run: |
          set -e

          echo "============================================================"
          echo " LaorORG Ubuntu GUI Runner"
          echo "============================================================"

          echo "OS:"
          cat /etc/os-release

          echo ""
          echo "Kernel:"
          uname -a

          echo ""
          echo "CPU:"
          nproc
          lscpu | grep -E '^CPU\(s\)|Model name' || true

          echo ""
          echo "Memory:"
          free -h

          echo ""
          echo "Disk:"
          df -h

          echo "============================================================"


      # ============================================================
      # UPDATE SYSTEM
      # ============================================================
      - name: Update Ubuntu
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive \
            apt-get upgrade -y


      # ============================================================
      # INSTALL XFCE + XRDP
      # ============================================================
      - name: Install XFCE Desktop and XRDP
        shell: bash
        run: |
          set -e

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-goodies \
            xfce4-terminal \
            dbus-x11 \
            xorg \
            xorgxrdp \
            xrdp \
            xauth \
            policykit-1 \
            curl \
            wget \
            unzip \
            git \
            nano \
            vim \
            htop \
            net-tools \
            iproute2 \
            ca-certificates \
            gnupg \
            lsb-release \
            ufw


      # ============================================================
      # SET HOSTNAME
      # ============================================================
      - name: Configure Hostname
        shell: bash
        run: |
          set -e

          sudo hostnamectl set-hostname "$HOSTNAME"

          echo "$HOSTNAME" | sudo tee /etc/hostname

          CURRENT_HOSTS=$(grep -v "$HOSTNAME" /etc/hosts || true)

          echo "$CURRENT_HOSTS" | sudo tee /tmp/hosts.new

          echo "127.0.1.1 $HOSTNAME" | \
            sudo tee -a /tmp/hosts.new

          sudo cp /tmp/hosts.new /etc/hosts

          echo "Hostname:"
          hostname


      # ============================================================
      # CREATE RDP USER
      # ============================================================
      - name: Configure runneradmin User
        shell: bash
        run: |
          set -e

          if [ -z "$RDP_PASSWORD" ]; then
            echo "ERROR: RDP_PASSWORD GitHub Secret is empty."
            echo ""
            echo "Create this repository secret:"
            echo "RDP_PASSWORD"
            exit 1
          fi

          # Ubuntu GitHub-hosted runners normally have "runner",
          # not "runneradmin", so create the requested RDP account.
          if id "$RDP_USER" >/dev/null 2>&1; then
            echo "User $RDP_USER already exists."
          else
            sudo useradd \
              --create-home \
              --shell /bin/bash \
              "$RDP_USER"
          fi

          echo "$RDP_USER:$RDP_PASSWORD" | \
            sudo chpasswd

          # Add desktop/RDP user to useful groups.
          sudo usermod -aG sudo "$RDP_USER"
          sudo usermod -aG ssl-cert "$RDP_USER"

          # Configure passwordless sudo for this temporary runner.
          echo "$RDP_USER ALL=(ALL) NOPASSWD:ALL" | \
            sudo tee "/etc/sudoers.d/$RDP_USER"

          sudo chmod 440 "/etc/sudoers.d/$RDP_USER"

          # Create XFCE configuration.
          sudo -u "$RDP_USER" mkdir -p \
            "/home/$RDP_USER/.config/xfce4"

          sudo -u "$RDP_USER" bash -c \
            'echo "startxfce4" > ~/.xsession'

          sudo chown "$RDP_USER:$RDP_USER" \
            "/home/$RDP_USER/.xsession"

          sudo chmod 700 \
            "/home/$RDP_USER/.xsession"

          echo ""
          echo "RDP user:"
          echo "$RDP_USER"


      # ============================================================
      # CONFIGURE XRDP
      # ============================================================
      - name: Configure XRDP
        shell: bash
        run: |
          set -e

          # Backup original configuration.
          sudo cp /etc/xrdp/startwm.sh \
            /etc/xrdp/startwm.sh.backup

          # Configure XRDP to launch XFCE.
          sudo tee /etc/xrdp/startwm.sh > /dev/null <<'EOF'
          #!/bin/sh

          if test -r /etc/profile; then
              . /etc/profile
          fi

          if test -r "$HOME/.profile"; then
              . "$HOME/.profile"
          fi

          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR

          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_SESSION_DESKTOP=xfce
          export XDG_CONFIG_DIRS=/etc/xdg/xdg-xfce:/etc/xdg
          export XDG_DATA_DIRS=/usr/share/xfce4:/usr/local/share:/usr/share

          startxfce4
          EOF

          sudo chmod +x /etc/xrdp/startwm.sh

          # XRDP certificate permissions.
          sudo adduser xrdp ssl-cert || true

          # Enable XRDP.
          sudo systemctl enable xrdp
          sudo systemctl enable xrdp-sesman

          sudo systemctl restart xrdp
          sudo systemctl restart xrdp-sesman

          echo ""
          echo "XRDP status:"
          sudo systemctl --no-pager status xrdp || true


      # ============================================================
      # INSTALL TAILSCALE
      # ============================================================
      - name: Install Tailscale
        shell: bash
        run: |
          set -e

          if [ -z "$TAILSCALE_AUTH_KEY" ]; then
            echo "ERROR: TAILSCALE_AUTH_KEY GitHub Secret is empty."
            echo ""
            echo "Create this repository secret:"
            echo "TAILSCALE_AUTH_KEY"
            exit 1
          fi

          curl -fsSL \
            https://tailscale.com/install.sh | sh

          sudo systemctl enable tailscaled
          sudo systemctl start tailscaled

          echo ""
          echo "Tailscale version:"
          tailscale version


      # ============================================================
      # CONNECT TAILSCALE
      # ============================================================
      - name: Connect Tailscale
        shell: bash
        run: |
          set -e

          sudo tailscale up \
            --auth-key="$TAILSCALE_AUTH_KEY" \
            --hostname="$HOSTNAME" \
            --accept-dns=true

          sleep 5

          echo ""
          echo "============================================================"
          echo " TAILSCALE STATUS"
          echo "============================================================"

          sudo tailscale status

          echo ""
          echo "Tailscale IPv4:"
          TAILSCALE_IP=$(tailscale ip -4)

          echo "$TAILSCALE_IP"

          echo "TAILSCALE_IP=$TAILSCALE_IP" >> "$GITHUB_ENV"


      # ============================================================
      # CONFIGURE UFW
      # ============================================================
      - name: Configure Firewall
        shell: bash
        run: |
          set -e

          # Reset UFW rules.
          sudo ufw --force reset

          # Default policy.
          sudo ufw default deny incoming
          sudo ufw default allow outgoing

          # SSH is optional. We don't need public SSH.
          # Do NOT open RDP publicly.

          # Allow XRDP ONLY from the Tailscale CGNAT range.
          sudo ufw allow from 100.64.0.0/10 \
            to any port 3389 \
            proto tcp

          # Allow Tailscale interface.
          sudo ufw allow in on tailscale0

          # Enable firewall.
          sudo ufw --force enable

          echo ""
          echo "Firewall:"
          sudo ufw status verbose


      # ============================================================
      # PROTECT AGAINST SHUTDOWN / REBOOT
      # ============================================================
      - name: Disable Shutdown and Reboot Targets
        shell: bash
        run: |
          set -e

          echo "Masking shutdown/reboot targets..."

          sudo systemctl mask shutdown.target || true
          sudo systemctl mask reboot.target || true
          sudo systemctl mask halt.target || true
          sudo systemctl mask poweroff.target || true

          echo ""
          echo "Shutdown/reboot target status:"

          systemctl is-enabled shutdown.target 2>/dev/null || true
          systemctl is-enabled reboot.target 2>/dev/null || true
          systemctl is-enabled halt.target 2>/dev/null || true
          systemctl is-enabled poweroff.target 2>/dev/null || true


      # ============================================================
      # DISABLE AUTOMATIC APT REBOOT NOTIFICATION
      # ============================================================
      - name: Disable Automatic Reboot Helpers
        shell: bash
        run: |
          set -e

          # These are only best-effort protections.
          # GitHub can still terminate the hosted VM itself.
          sudo systemctl mask \
            apt-daily-upgrade.timer 2>/dev/null || true

          sudo systemctl mask \
            apt-daily.timer 2>/dev/null || true

          echo "Automatic apt timers handled."


      # ============================================================
      # VERIFY XRDP
      # ============================================================
      - name: Verify XRDP
        shell: bash
        run: |
          set -e

          echo "XRDP service:"
          sudo systemctl is-active xrdp

          echo ""
          echo "Listening ports:"
          sudo ss -lntp | grep 3389 || true

          echo ""
          echo "XRDP processes:"
          ps aux | grep '[x]rdp' || true


      # ============================================================
      # VERIFY TAILSCALE
      # ============================================================
      - name: Verify Tailscale
        shell: bash
        run: |
          set -e

          echo "Tailscale service:"
          sudo systemctl is-active tailscaled

          echo ""
          echo "Tailscale IP:"
          tailscale ip -4

          echo ""
          echo "Tailscale status:"
          tailscale status


      # ============================================================
      # VERIFY FIREWALL
      # ============================================================
      - name: Verify Firewall
        shell: bash
        run: |
          echo "============================================================"
          echo " FIREWALL"
          echo "============================================================"

          sudo ufw status numbered


      # ============================================================
      # SHOW REMOTE CONNECTION INFORMATION
      # ============================================================
      - name: Show Remote Desktop Information
        shell: bash
        run: |
          TAILSCALE_IP=$(tailscale ip -4)

          echo ""
          echo "============================================================"
          echo "        LaorORG UBUNTU GUI IS READY"
          echo "============================================================"
          echo ""
          echo "Operating System : Ubuntu 24.04"
          echo "Desktop          : XFCE"
          echo "Remote Protocol  : RDP / XRDP"
          echo ""
          echo "Tailscale IP     : $TAILSCALE_IP"
          echo "RDP Address      : $TAILSCALE_IP:3389"
          echo ""
          echo "Username         : runneradmin"
          echo "Password         : GitHub Secret RDP_PASSWORD"
          echo ""
          echo "============================================================"
          echo " WINDOWS CONNECTION"
          echo "============================================================"
          echo ""
          echo "1. Install/login to Tailscale on your Windows PC."
          echo ""
          echo "2. Open:"
          echo "   Remote Desktop Connection"
          echo ""
          echo "3. Enter:"
          echo "   $TAILSCALE_IP:3389"
          echo ""
          echo "4. Username:"
          echo "   runneradmin"
          echo ""
          echo "5. Password:"
          echo "   Your RDP_PASSWORD secret"
          echo ""
          echo "============================================================"


      # ============================================================
      # FINAL SYSTEM CHECK
      # ============================================================
      - name: Final System Check
        shell: bash
        run: |
          echo ""
          echo "============================================================"
          echo " FINAL SYSTEM CHECK"
          echo "============================================================"

          echo ""
          echo "Hostname:"
          hostname

          echo ""
          echo "Uptime:"
          uptime

          echo ""
          echo "CPU:"
          nproc

          echo ""
          echo "Memory:"
          free -h

          echo ""
          echo "Disk:"
          df -h /

          echo ""
          echo "XRDP:"
          sudo systemctl is-active xrdp || true

          echo ""
          echo "Tailscale:"
          sudo systemctl is-active tailscaled || true

          echo ""
          echo "Tailscale IP:"
          tailscale ip -4 || true

          echo ""
          echo "Firewall:"
          sudo ufw status || true

          echo ""
          echo "============================================================"


      # ============================================================
      # KEEP RUNNER ALIVE
      # ============================================================
      - name: Keep Ubuntu GUI Alive
        shell: bash
        run: |
          set +e

          echo ""
          echo "============================================================"
          echo " LaorORG Ubuntu GUI RUNNER IS ONLINE"
          echo "============================================================"

          TAILSCALE_IP=$(tailscale ip -4 2>/dev/null)

          echo ""
          echo "RDP:"
          echo "$TAILSCALE_IP:3389"

          echo ""
          echo "Username:"
          echo "runneradmin"

          echo ""
          echo "Desktop:"
          echo "XFCE"

          echo ""
          echo "Remote:"
          echo "Tailscale + XRDP"

          echo ""
          echo "The workflow will remain running."
          echo "============================================================"

          while true
          do

            echo ""
            echo "------------------------------------------------------------"
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] LaorORG runner alive"
            echo "------------------------------------------------------------"

            echo ""
            echo "Uptime:"
            uptime

            echo ""
            echo "CPU:"
            nproc

            echo ""
            echo "Load:"
            cat /proc/loadavg

            echo ""
            echo "Memory:"
            free -h

            echo ""
            echo "Disk:"
            df -h / | tail -1

            echo ""
            echo "Tailscale IP:"
            tailscale ip -4 2>/dev/null || true

            echo ""
            echo "XRDP:"
            sudo systemctl is-active xrdp 2>/dev/null || true

            echo ""
            echo "Tailscale:"
            sudo systemctl is-active tailscaled 2>/dev/null || true

            echo ""
            echo "RDP listening:"
            sudo ss -lntp 2>/dev/null | grep ':3389' || true

            echo ""
            echo "------------------------------------------------------------"
            echo "Runner remains online."
            echo "------------------------------------------------------------"

            # Check every 5 minutes.
            sleep 300

          done
