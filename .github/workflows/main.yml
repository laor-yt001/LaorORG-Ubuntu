name: LaorORG Ubuntu GUI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu-gui:
    name: LaorORG Ubuntu XFCE RDP
    runs-on: ubuntu-24.04

    timeout-minutes: 43200

    env:
      RDP_USER: runneradmin
      RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      HOSTNAME: LaorORG-Ubuntu

    steps:

      # ============================================================
      # 1. UPDATE UBUNTU
      # ============================================================
      - name: Update Ubuntu
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive \
            apt-get upgrade -y


      # ============================================================
      # 2. INSTALL DESKTOP + XRDP + DBUS
      # ============================================================
      - name: Install XFCE XRDP DBus
        shell: bash
        run: |
          set -eux

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-goodies \
            xfce4-session \
            xfconf \
            xfdesktop4 \
            xfwm4 \
            xfce4-panel \
            xfce4-settings \
            xfce4-terminal \
            thunar \
            dbus \
            dbus-x11 \
            dbus-user-session \
            xorg \
            xorgxrdp \
            xrdp \
            xauth \
            policykit-1 \
            policykit-1-gnome \
            sudo \
            curl \
            wget \
            git \
            unzip \
            nano \
            vim \
            htop \
            net-tools \
            iproute2 \
            ca-certificates \
            ufw

          echo ""
          echo "============================================================"
          echo " XFCE INSTALLATION CHECK"
          echo "============================================================"

          command -v xfce4-session
          command -v startxfce4
          command -v xfconfd
          command -v xfconf-query
          command -v dbus-run-session
          command -v xrdp


      # ============================================================
      # 3. HOSTNAME
      # ============================================================
      - name: Configure Hostname
        shell: bash
        run: |
          set -eux

          sudo hostnamectl set-hostname "$HOSTNAME"

          echo "$HOSTNAME" | sudo tee /etc/hostname

          if ! grep -q "$HOSTNAME" /etc/hosts; then
            echo "127.0.1.1 $HOSTNAME" | \
              sudo tee -a /etc/hosts
          fi

          hostname


      # ============================================================
      # 4. CREATE RDP USER
      # ============================================================
      - name: Create runneradmin
        shell: bash
        run: |
          set -eux

          if [ -z "$RDP_PASSWORD" ]; then
            echo "ERROR: RDP_PASSWORD secret is empty."
            exit 1
          fi

          if id "$RDP_USER" >/dev/null 2>&1; then
            echo "$RDP_USER already exists."
          else
            sudo useradd \
              -m \
              -s /bin/bash \
              "$RDP_USER"
          fi

          echo "$RDP_USER:$RDP_PASSWORD" | \
            sudo chpasswd

          sudo usermod -aG sudo "$RDP_USER"
          sudo usermod -aG ssl-cert "$RDP_USER"

          echo "$RDP_USER ALL=(ALL) NOPASSWD:ALL" | \
            sudo tee "/etc/sudoers.d/$RDP_USER"

          sudo chmod 440 \
            "/etc/sudoers.d/$RDP_USER"

          sudo chown -R \
            "$RDP_USER:$RDP_USER" \
            "/home/$RDP_USER"

          echo ""
          echo "User:"
          id "$RDP_USER"


      # ============================================================
      # 5. CREATE CORRECT XFCE FAILSAFE CONFIGURATION
      # ============================================================
      - name: Create XFCE Failsafe Configuration
        shell: bash
        run: |
          set -eux

          USER_HOME="/home/$RDP_USER"

          # --------------------------------------------------------
          # SYSTEM XFCE CONFIGURATION
          # --------------------------------------------------------
          XFCE_SYSTEM_DIR="/etc/xdg/xfce4/xfconf/xfce-perchannel-xml"

          sudo mkdir -p "$XFCE_SYSTEM_DIR"

          # This is the critical configuration.
          sudo tee \
            "$XFCE_SYSTEM_DIR/xfce4-session.xml" \
            > /dev/null <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>

          <channel name="xfce4-session" version="1.0">

            <property name="general" type="empty">

              <property
                name="FailsafeSessionName"
                type="string"
                value="Failsafe"/>

              <property
                name="SessionName"
                type="string"
                value="Default"/>

              <property
                name="SaveOnExit"
                type="bool"
                value="false"/>

              <property
                name="PromptOnLogout"
                type="bool"
                value="false"/>

            </property>

            <property name="sessions" type="empty">

              <property name="Failsafe" type="empty">

                <property
                  name="IsFailsafe"
                  type="bool"
                  value="true"/>

                <property
                  name="Count"
                  type="int"
                  value="5"/>

                <property
                  name="Client0_Command"
                  type="array">
                  <value type="string" value="xfwm4"/>
                </property>

                <property
                  name="Client0_PerScreen"
                  type="bool"
                  value="false"/>

                <property
                  name="Client0_Priority"
                  type="int"
                  value="15"/>

                <property
                  name="Client1_Command"
                  type="array">
                  <value type="string" value="xfsettingsd"/>
                </property>

                <property
                  name="Client1_PerScreen"
                  type="bool"
                  value="false"/>

                <property
                  name="Client1_Priority"
                  type="int"
                  value="20"/>

                <property
                  name="Client2_Command"
                  type="array">
                  <value type="string" value="xfce4-panel"/>
                </property>

                <property
                  name="Client2_PerScreen"
                  type="bool"
                  value="false"/>

                <property
                  name="Client2_Priority"
                  type="int"
                  value="25"/>

                <property
                  name="Client3_Command"
                  type="array">
                  <value type="string" value="Thunar"/>
                  <value type="string" value="--daemon"/>
                </property>

                <property
                  name="Client3_PerScreen"
                  type="bool"
                  value="false"/>

                <property
                  name="Client3_Priority"
                  type="int"
                  value="30"/>

                <property
                  name="Client4_Command"
                  type="array">
                  <value type="string" value="xfdesktop"/>
                </property>

                <property
                  name="Client4_PerScreen"
                  type="bool"
                  value="false"/>

                <property
                  name="Client4_Priority"
                  type="int"
                  value="35"/>

              </property>

            </property>

            <property name="shutdown" type="empty">

              <property
                name="LockScreen"
                type="bool"
                value="false"/>

            </property>

          </channel>
          EOF

          sudo chmod 644 \
            "$XFCE_SYSTEM_DIR/xfce4-session.xml"


          # --------------------------------------------------------
          # USER XFCE CONFIGURATION
          # --------------------------------------------------------
          USER_XFCE_DIR="$USER_HOME/.config/xfce4/xfconf/xfce-perchannel-xml"

          sudo mkdir -p "$USER_XFCE_DIR"

          sudo cp \
            "$XFCE_SYSTEM_DIR/xfce4-session.xml" \
            "$USER_XFCE_DIR/xfce4-session.xml"

          sudo chown -R \
            "$RDP_USER:$RDP_USER" \
            "$USER_HOME/.config"


          # --------------------------------------------------------
          # REMOVE CORRUPTED SESSION CACHE
          # --------------------------------------------------------
          sudo rm -rf \
            "$USER_HOME/.cache/sessions"

          sudo mkdir -p \
            "$USER_HOME/.cache/sessions"

          sudo chown -R \
            "$RDP_USER:$RDP_USER" \
            "$USER_HOME/.cache"


          # --------------------------------------------------------
          # VERIFY FILE
          # --------------------------------------------------------
          echo ""
          echo "============================================================"
          echo " XFCE SESSION CONFIG"
          echo "============================================================"

          cat \
            "$XFCE_SYSTEM_DIR/xfce4-session.xml"


      # ============================================================
      # 6. CONFIGURE USER SESSION
      # ============================================================
      - name: Configure User XFCE Session
        shell: bash
        run: |
          set -eux

          USER_HOME="/home/$RDP_USER"

          sudo tee "$USER_HOME/.xsession" > /dev/null <<'EOF'
          #!/bin/sh

          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR

          export LANG=C.UTF-8
          export LANGUAGE=C.UTF-8
          export LC_ALL=C.UTF-8

          export XDG_SESSION_TYPE=x11
          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_SESSION_DESKTOP=xfce

          export XDG_CONFIG_DIRS="/etc/xdg"

          exec dbus-run-session -- startxfce4
          EOF

          sudo chmod 700 \
            "$USER_HOME/.xsession"


          sudo tee "$USER_HOME/.xsessionrc" > /dev/null <<'EOF'
          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR

          export LANG=C.UTF-8
          export LANGUAGE=C.UTF-8
          export LC_ALL=C.UTF-8

          export XDG_SESSION_TYPE=x11
          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_SESSION_DESKTOP=xfce

          export XDG_CONFIG_DIRS="/etc/xdg"
          EOF

          sudo chmod 700 \
            "$USER_HOME/.xsession"

          sudo chmod 700 \
            "$USER_HOME/.xsessionrc"

          sudo chown \
            "$RDP_USER:$RDP_USER" \
            "$USER_HOME/.xsession"

          sudo chown \
            "$RDP_USER:$RDP_USER" \
            "$USER_HOME/.xsessionrc"


      # ============================================================
      # 7. CONFIGURE XRDP
      # ============================================================
      - name: Configure XRDP
        shell: bash
        run: |
          set -eux

          sudo cp \
            /etc/xrdp/startwm.sh \
            /etc/xrdp/startwm.sh.backup

          sudo tee /etc/xrdp/startwm.sh > /dev/null <<'EOF'
          #!/bin/sh

          if [ -r /etc/profile ]; then
              . /etc/profile
          fi

          if [ -r "$HOME/.profile" ]; then
              . "$HOME/.profile"
          fi

          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR

          export LANG=C.UTF-8
          export LANGUAGE=C.UTF-8
          export LC_ALL=C.UTF-8

          export XDG_SESSION_TYPE=x11
          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_SESSION_DESKTOP=xfce

          # IMPORTANT:
          # /etc must be present.
          export XDG_CONFIG_DIRS="/etc/xdg"

          # Start a fresh D-Bus session.
          exec dbus-run-session -- startxfce4
          EOF

          sudo chmod +x \
            /etc/xrdp/startwm.sh

          sudo adduser xrdp ssl-cert || true

          sudo systemctl enable xrdp
          sudo systemctl enable xrdp-sesman

          sudo systemctl restart xrdp-sesman
          sudo systemctl restart xrdp

          sleep 5

          echo ""
          echo "XRDP status:"
          sudo systemctl --no-pager status xrdp || true


      # ============================================================
      # 8. TEST XFCONF / FAILSAFE
      # ============================================================
      - name: Verify XFCE Configuration
        shell: bash
        run: |
          set -eux

          USER_HOME="/home/$RDP_USER"

          echo ""
          echo "============================================================"
          echo " XFCE CONFIGURATION TEST"
          echo "============================================================"

          echo ""
          echo "System config:"
          cat \
            /etc/xdg/xfce4/xfconf/xfce-perchannel-xml/xfce4-session.xml

          echo ""
          echo "User config:"
          cat \
            "$USER_HOME/.config/xfce4/xfconf/xfce-perchannel-xml/xfce4-session.xml"

          echo ""
          echo "XDG_CONFIG_DIRS:"
          sudo -u "$RDP_USER" \
            env XDG_CONFIG_DIRS=/etc/xdg \
            bash -c 'echo "$XDG_CONFIG_DIRS"'


      # ============================================================
      # 9. INSTALL TAILSCALE
      # ============================================================
      - name: Install Tailscale
        shell: bash
        run: |
          set -eux

          if [ -z "$TAILSCALE_AUTH_KEY" ]; then
            echo "ERROR: TAILSCALE_AUTH_KEY secret is empty."
            exit 1
          fi

          curl -fsSL \
            https://tailscale.com/install.sh | sh

          sudo systemctl enable tailscaled
          sudo systemctl start tailscaled

          sleep 3

          tailscale version


      # ============================================================
      # 10. CONNECT TAILSCALE
      # ============================================================
      - name: Connect Tailscale
        shell: bash
        run: |
          set -eux

          sudo tailscale up \
            --auth-key="$TAILSCALE_AUTH_KEY" \
            --hostname="$HOSTNAME" \
            --accept-dns=true

          sleep 5

          TAILSCALE_IP=$(tailscale ip -4)

          echo "TAILSCALE_IP=$TAILSCALE_IP" >> "$GITHUB_ENV"

          echo ""
          echo "Tailscale IP:"
          echo "$TAILSCALE_IP"

          echo ""
          echo "Tailscale status:"
          tailscale status


      # ============================================================
      # 11. FIREWALL
      # ============================================================
      - name: Configure Firewall
        shell: bash
        run: |
          set -eux

          sudo ufw --force reset

          sudo ufw default deny incoming
          sudo ufw default allow outgoing

          # RDP ONLY from Tailscale.
          sudo ufw allow \
            from 100.64.0.0/10 \
            to any port 3389 \
            proto tcp

          sudo ufw allow in on tailscale0

          sudo ufw --force enable

          sudo ufw status verbose


      # ============================================================
      # 12. VERIFY XRDP
      # ============================================================
      - name: Verify XRDP
        shell: bash
        run: |
          set -eux

          echo ""
          echo "XRDP:"
          sudo systemctl is-active xrdp

          echo ""
          echo "XRDP SESMAN:"
          sudo systemctl is-active xrdp-sesman

          echo ""
          echo "Port:"
          sudo ss -lntp | grep ':3389'

          echo ""
          echo "XRDP processes:"
          ps aux | grep '[x]rdp'


      # ============================================================
      # 13. SHOW LOGS IF SOMETHING FAILS
      # ============================================================
      - name: Show XRDP Logs
        if: always()
        shell: bash
        run: |
          echo ""
          echo "============================================================"
          echo " XRDP LOG"
          echo "============================================================"

          sudo tail -100 \
            /var/log/xrdp.log \
            2>/dev/null || true

          echo ""
          echo "============================================================"
          echo " XRDP SESMAN LOG"
          echo "============================================================"

          sudo tail -150 \
            /var/log/xrdp-sesman.log \
            2>/dev/null || true


      # ============================================================
      # 14. DISABLE SHUTDOWN / REBOOT
      # ============================================================
      - name: Disable Shutdown and Reboot
        shell: bash
        run: |
          set -eux

          sudo systemctl mask shutdown.target || true
          sudo systemctl mask reboot.target || true
          sudo systemctl mask halt.target || true
          sudo systemctl mask poweroff.target || true

          echo "Shutdown/reboot targets masked."


      # ============================================================
      # 15. SHOW CONNECTION
      # ============================================================
      - name: Show RDP Connection
        shell: bash
        run: |
          TAILSCALE_IP=$(tailscale ip -4)

          echo ""
          echo "============================================================"
          echo "        LAORORG UBUNTU GUI READY"
          echo "============================================================"
          echo ""
          echo "OS       : Ubuntu 24.04"
          echo "Desktop  : XFCE"
          echo "Protocol : XRDP"
          echo ""
          echo "RDP:"
          echo "$TAILSCALE_IP:3389"
          echo ""
          echo "Username:"
          echo "runneradmin"
          echo ""
          echo "Password:"
          echo "RDP_PASSWORD GitHub Secret"
          echo ""
          echo "============================================================"


      # ============================================================
      # 16. KEEP RUNNER ALIVE
      # ============================================================
      - name: Keep Runner Alive
        shell: bash
        run: |
          set +e

          echo ""
          echo "============================================================"
          echo " LAORORG UBUNTU GUI ONLINE"
          echo "============================================================"

          while true
          do

            echo ""
            echo "------------------------------------------------------------"
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] RUNNER ALIVE"
            echo "------------------------------------------------------------"

            echo ""
            echo "Hostname:"
            hostname

            echo ""
            echo "Uptime:"
            uptime

            echo ""
            echo "CPU:"
            nproc

            echo ""
            echo "Memory:"
            free -h

            echo ""
            echo "Disk:"
            df -h / | tail -1

            echo ""
            echo "Tailscale:"
            tailscale ip -4 2>/dev/null || true

            echo ""
            echo "XRDP:"
            sudo systemctl is-active xrdp 2>/dev/null || true

            echo ""
            echo "RDP:"
            sudo ss -lntp 2>/dev/null | grep ':3389' || true

            echo ""
            echo "------------------------------------------------------------"

            sleep 300

          done
