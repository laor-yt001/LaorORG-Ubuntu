name: LaorORG Ubuntu GUI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu-gui:
    name: LaorORG Ubuntu XFCE RDP
    runs-on: ubuntu-24.04

    timeout-minutes: 350

    env:
      RDP_USER: runneradmin
      RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
      TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      HOSTNAME: LaorORG-Ubuntu

    steps:

      # ============================================================
      # UPDATE
      # ============================================================
      - name: Update Ubuntu
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive \
            apt-get upgrade -y


      # ============================================================
      # INSTALL XFCE + XRDP
      # ============================================================
      - name: Install XFCE XRDP DBUS
        shell: bash
        run: |
          set -eux

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-goodies \
            xfce4-session \
            xfconf \
            xfdesktop4 \
            xfwm4 \
            xfce4-panel \
            xfce4-settings \
            xfce4-terminal \
            dbus \
            dbus-x11 \
            dbus-user-session \
            xorg \
            xorgxrdp \
            xrdp \
            xauth \
            policykit-1 \
            policykit-1-gnome \
            sudo \
            curl \
            wget \
            git \
            unzip \
            nano \
            vim \
            htop \
            net-tools \
            iproute2 \
            ca-certificates \
            ufw

          echo ""
          echo "Installed:"
          command -v startxfce4
          command -v xfce4-session
          command -v xfconf-query
          command -v dbus-launch
          command -v dbus-run-session


      # ============================================================
      # HOSTNAME
      # ============================================================
      - name: Configure Hostname
        shell: bash
        run: |
          set -eux

          sudo hostnamectl set-hostname "$HOSTNAME"

          echo "$HOSTNAME" | sudo tee /etc/hostname

          if ! grep -q "$HOSTNAME" /etc/hosts; then
            echo "127.0.1.1 $HOSTNAME" | \
              sudo tee -a /etc/hosts
          fi


      # ============================================================
      # CREATE RDP USER
      # ============================================================
      - name: Create RDP User
        shell: bash
        run: |
          set -eux

          if [ -z "$RDP_PASSWORD" ]; then
            echo "ERROR: RDP_PASSWORD is empty."
            exit 1
          fi

          if id "$RDP_USER" >/dev/null 2>&1; then
            echo "$RDP_USER already exists."
          else
            sudo useradd \
              --create-home \
              --shell /bin/bash \
              "$RDP_USER"
          fi

          echo "$RDP_USER:$RDP_PASSWORD" | \
            sudo chpasswd

          sudo usermod -aG sudo "$RDP_USER"
          sudo usermod -aG ssl-cert "$RDP_USER"

          echo "$RDP_USER ALL=(ALL) NOPASSWD:ALL" | \
            sudo tee "/etc/sudoers.d/$RDP_USER"

          sudo chmod 440 \
            "/etc/sudoers.d/$RDP_USER"

          sudo chown -R \
            "$RDP_USER:$RDP_USER" \
            "/home/$RDP_USER"


      # ============================================================
      # CLEAN OLD XFCE SESSION
      # ============================================================
      - name: Clean XFCE Session
        shell: bash
        run: |
          set -eux

          USER_HOME="/home/$RDP_USER"

          # Remove stale XFCE sessions.
          sudo rm -rf \
            "$USER_HOME/.cache/sessions"

          # Remove stale session files.
          sudo rm -f \
            "$USER_HOME/.Xauthority" \
            "$USER_HOME/.ICEauthority"

          # Recreate cache.
          sudo -u "$RDP_USER" mkdir -p \
            "$USER_HOME/.cache"

          sudo -u "$RDP_USER" mkdir -p \
            "$USER_HOME/.config"

          sudo chown -R \
            "$RDP_USER:$RDP_USER" \
            "$USER_HOME"


      # ============================================================
      # XFCE XSESSION
      # ============================================================
      - name: Configure XFCE XSession
        shell: bash
        run: |
          set -eux

          USER_HOME="/home/$RDP_USER"

          # IMPORTANT:
          # Keep this file simple.
          # Do not add custom XDG_CONFIG_DIRS here.
          sudo tee "$USER_HOME/.xsession" > /dev/null <<'EOF'
          #!/bin/sh

          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR

          export XDG_SESSION_TYPE=x11
          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_SESSION_DESKTOP=xfce

          export XDG_CONFIG_DIRS="/etc/xdg/xdg-xfce:/etc/xdg"

          exec dbus-run-session -- xfce4-session
          EOF

          sudo chmod 700 \
            "$USER_HOME/.xsession"

          sudo chown \
            "$RDP_USER:$RDP_USER" \
            "$USER_HOME/.xsession"


      # ============================================================
      # XSESSIONRC
      # ============================================================
      - name: Configure XSession RC
        shell: bash
        run: |
          set -eux

          USER_HOME="/home/$RDP_USER"

          sudo tee "$USER_HOME/.xsessionrc" > /dev/null <<'EOF'
          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR

          export XDG_SESSION_TYPE=x11
          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_SESSION_DESKTOP=xfce
          export XDG_CONFIG_DIRS="/etc/xdg/xdg-xfce:/etc/xdg"
          EOF

          sudo chmod 700 \
            "$USER_HOME/.xsessionrc"

          sudo chown \
            "$RDP_USER:$RDP_USER" \
            "$USER_HOME/.xsessionrc"


      # ============================================================
      # XFCE CONFIG DIRECTORY
      # ============================================================
      - name: Prepare XFCE Configuration
        shell: bash
        run: |
          set -eux

          # Make absolutely sure XFCE config directories exist.
          sudo mkdir -p /etc/xdg/xdg-xfce

          sudo mkdir -p \
            /etc/xdg/xdg-xfce/xfce4

          # Make sure the standard XFCE configuration exists.
          if [ -d /etc/xdg/xfce4 ]; then
            sudo cp -a \
              /etc/xdg/xfce4/. \
              /etc/xdg/xdg-xfce/xfce4/ \
              || true
          fi

          echo ""
          echo "XDG directories:"
          ls -la /etc/xdg
          ls -la /etc/xdg/xdg-xfce || true


      # ============================================================
      # XRDP STARTWM
      # ============================================================
      - name: Configure XRDP
        shell: bash
        run: |
          set -eux

          sudo cp \
            /etc/xrdp/startwm.sh \
            /etc/xrdp/startwm.sh.original

          # IMPORTANT:
          # Do not fall through into another desktop session.
          sudo tee /etc/xrdp/startwm.sh > /dev/null <<'EOF'
          #!/bin/sh

          if [ -r /etc/profile ]; then
              . /etc/profile
          fi

          if [ -r "$HOME/.profile" ]; then
              . "$HOME/.profile"
          fi

          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR

          export XDG_SESSION_TYPE=x11
          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_SESSION_DESKTOP=xfce
          export XDG_CONFIG_DIRS="/etc/xdg/xdg-xfce:/etc/xdg"

          # Start exactly one XFCE session.
          exec dbus-run-session -- xfce4-session
          EOF

          sudo chmod +x \
            /etc/xrdp/startwm.sh

          # XRDP certificate permission.
          sudo adduser xrdp ssl-cert || true

          # Enable XRDP.
          sudo systemctl enable xrdp
          sudo systemctl enable xrdp-sesman

          # Restart.
          sudo systemctl restart xrdp-sesman
          sudo systemctl restart xrdp

          sleep 5

          echo ""
          echo "XRDP status:"
          sudo systemctl --no-pager status xrdp || true


      # ============================================================
      # VERIFY XFCE WITHOUT RDP
      # ============================================================
      - name: Test XFCE Session
        shell: bash
        run: |
          set +e

          USER_HOME="/home/$RDP_USER"

          echo "============================================================"
          echo " XFCE TEST"
          echo "============================================================"

          echo ""
          echo "XFCE:"
          command -v xfce4-session
          xfce4-session --version

          echo ""
          echo "XFConf:"
          command -v xfconf-query

          echo ""
          echo "DBus:"
          command -v dbus-run-session
          dbus-run-session --version

          echo ""
          echo "XDG_CONFIG_DIRS:"
          echo "/etc/xdg/xdg-xfce:/etc/xdg"

          echo ""
          echo "XDG XFCE:"
          ls -la /etc/xdg/xdg-xfce || true

          echo ""
          echo "User files:"
          ls -la "$USER_HOME/.xsession"
          ls -la "$USER_HOME/.xsessionrc"

          echo ""
          echo "Ownership:"
          stat "$USER_HOME/.xsession"
          stat "$USER_HOME/.xsessionrc"


      # ============================================================
      # INSTALL TAILSCALE
      # ============================================================
      - name: Install Tailscale
        shell: bash
        run: |
          set -eux

          if [ -z "$TAILSCALE_AUTH_KEY" ]; then
            echo "ERROR: TAILSCALE_AUTH_KEY is empty."
            exit 1
          fi

          curl -fsSL \
            https://tailscale.com/install.sh | sh

          sudo systemctl enable tailscaled
          sudo systemctl start tailscaled

          sleep 3

          tailscale version


      # ============================================================
      # CONNECT TAILSCALE
      # ============================================================
      - name: Connect Tailscale
        shell: bash
        run: |
          set -eux

          sudo tailscale up \
            --auth-key="$TAILSCALE_AUTH_KEY" \
            --hostname="$HOSTNAME" \
            --accept-dns=true

          sleep 5

          echo ""
          echo "Tailscale:"
          tailscale status

          echo ""
          echo "IPv4:"

          TAILSCALE_IP=$(tailscale ip -4)

          echo "$TAILSCALE_IP"

          echo "TAILSCALE_IP=$TAILSCALE_IP" >> "$GITHUB_ENV"


      # ============================================================
      # FIREWALL
      # ============================================================
      - name: Configure Firewall
        shell: bash
        run: |
          set -eux

          sudo ufw --force reset

          sudo ufw default deny incoming
          sudo ufw default allow outgoing

          # Only Tailscale can access RDP.
          sudo ufw allow \
            from 100.64.0.0/10 \
            to any port 3389 \
            proto tcp

          sudo ufw allow in on tailscale0

          sudo ufw --force enable

          sudo ufw status verbose


      # ============================================================
      # XRDP FINAL CHECK
      # ============================================================
      - name: Final XRDP Check
        shell: bash
        run: |
          set -eux

          echo ""
          echo "XRDP:"
          sudo systemctl is-active xrdp

          echo ""
          echo "XRDP SESMAN:"
          sudo systemctl is-active xrdp-sesman

          echo ""
          echo "Port 3389:"
          sudo ss -lntp | grep 3389

          echo ""
          echo "XRDP processes:"
          ps aux | grep '[x]rdp'


      # ============================================================
      # SHUTDOWN / REBOOT PROTECTION
      # ============================================================
      - name: Disable Shutdown and Reboot
        shell: bash
        run: |
          set -eux

          sudo systemctl mask shutdown.target || true
          sudo systemctl mask reboot.target || true
          sudo systemctl mask halt.target || true
          sudo systemctl mask poweroff.target || true

          echo "Shutdown/reboot targets masked."


      # ============================================================
      # DISPLAY CONNECTION INFO
      # ============================================================
      - name: Show RDP Information
        shell: bash
        run: |
          TAILSCALE_IP=$(tailscale ip -4)

          echo ""
          echo "============================================================"
          echo "       LAORORG UBUNTU GUI READY"
          echo "============================================================"
          echo ""
          echo "Ubuntu:"
          echo "24.04"
          echo ""
          echo "Desktop:"
          echo "XFCE"
          echo ""
          echo "RDP:"
          echo "$TAILSCALE_IP:3389"
          echo ""
          echo "Username:"
          echo "runneradmin"
          echo ""
          echo "Password:"
          echo "RDP_PASSWORD GitHub Secret"
          echo ""
          echo "============================================================"


      # ============================================================
      # KEEP ALIVE
      # ============================================================
      - name: Keep Runner Alive
        shell: bash
        run: |
          set +e

          echo ""
          echo "============================================================"
          echo " LAORORG UBUNTU GUI ONLINE"
          echo "============================================================"

          while true
          do

            echo ""
            echo "------------------------------------------------------------"
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] RUNNER ALIVE"
            echo "------------------------------------------------------------"

            echo ""
            echo "Hostname:"
            hostname

            echo ""
            echo "Uptime:"
            uptime

            echo ""
            echo "CPU:"
            nproc

            echo ""
            echo "Memory:"
            free -h

            echo ""
            echo "Disk:"
            df -h / | tail -1

            echo ""
            echo "Tailscale:"
            tailscale ip -4 2>/dev/null || true

            echo ""
            echo "XRDP:"
            sudo systemctl is-active xrdp 2>/dev/null || true

            echo ""
            echo "RDP:"
            sudo ss -lntp 2>/dev/null | grep ':3389' || true

            echo ""
            echo "------------------------------------------------------------"

            sleep 300

          done
